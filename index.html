<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dag: Land Clearance Demo</title>
  <meta name="description" content="Dag is a clearance gate in front of land registration in Bangladesh. Live demo with a judge's guide. LandTech 2026, team Silicon Knights.">
  <meta name="theme-color" content="#0f3d2e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230f3d2e'/%3E%3Cpath d='M9 11.5 19 9.5 20.5 19 10.5 21Z' fill='%233fa676'/%3E%3Cpath d='M19 9.5 31 11 30 20.5 20.5 19M10.5 21 12 31 22 30 20.5 19M22 30 30.5 29 30 20.5' fill='none' stroke='%239fd3b8' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/dag.css">

<body>
  <div class="stage">
    <section class="device-col" aria-label="Phone demo">
      <div class="device">
        <div class="screen">
          <div class="island" aria-hidden="true"></div>
          <div class="statusbar" aria-hidden="true">
            <span id="clock">9:41</span>
            <span class="sb-r">
              <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
              <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1 4a9.5 9.5 0 0 1 13 0M3.4 6.6a6 6 0 0 1 8.2 0M5.8 9a2.6 2.6 0 0 1 3.4 0"/></svg>

            </span>
          </div>
          <div class="push" id="push" role="status" aria-live="polite"></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
          <div class="view" id="view"></div>
        </div>
      </div>
      <p class="device-cap">Live prototype &middot; fictional records &middot; runs in your browser</p>
    </section>
    <aside class="guide" id="guide" aria-label="Demo guide"></aside>
  </div>

  <!-- third-party, vendored (see README) -->
  <script src="js/vendor/nacl-fast.min.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <!-- the gate's backend: same code the tests run -->
  <script src="js/server/crypto.js"></script>
  <script src="js/server/seed.js"></script>
  <script src="js/server/engine.js"></script>
  <script src="js/server/oracle.js"></script>
  <script src="js/server/server.js"></script>
  <!-- the phone app and the guide: talk to the backend only through js/client/api.js -->

  <script src="js/client/api.js"></script>
  <script src="js/client/app.js"></script>
  <script src="js/client/guide.js"></script>
